name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, linux, ARM64, symsvel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run qa
      - name: Verify deployable static build
        run: |
          test -f build/index.html
          test -f build/.htaccess
          test -f build/robots.txt
