name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, linux, ARM64, symsvel]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run qa
      - name: Publish GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace(/^refs\/tags\//, '');
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected semantic version tag.');
            const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            if (ref.data.ref !== `refs/tags/${tag}`) throw new Error('Tag verification failed.');
            await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: tag,
              body: "Release initiale de validation. Aucun changement fonctionnel. Cette version sert de référence pour tester le processus de mise à jour en environnement APP_ENV=dev."
            });
